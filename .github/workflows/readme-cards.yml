name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # With a STATS_TOKEN secret (classic PAT, read:user), the card counts
      # last year's private contributions. Without it, all-time public commits.
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
      COMMON: username=vahiwe&show_icons=true&hide_border=true&rank_icon=github
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (dark, with private contributions)
        if: env.HAS_STATS_TOKEN == 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&count_private=true&theme=github_dark&bg_color=0d1117
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Stats card (light, with private contributions)
        if: env.HAS_STATS_TOKEN == 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&count_private=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark, public only)
        if: env.HAS_STATS_TOKEN != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&include_all_commits=true&theme=github_dark&bg_color=0d1117
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (light, public only)
        if: env.HAS_STATS_TOKEN != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&include_all_commits=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: WakaTime card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=vahiwe&layout=compact&langs_count=8&hide=json,markdown,other,text,csv,tsconfig,mdx,git%20config&hide_border=true&theme=github_dark&bg_color=0d1117
          path: profile/wakatime-dark.svg
          fail_on_error: true

      - name: WakaTime card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=vahiwe&layout=compact&langs_count=8&hide=json,markdown,other,text,csv,tsconfig,mdx,git%20config&hide_border=true&theme=default
          path: profile/wakatime-light.svg
          fail_on_error: true

      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=vahiwe&theme=github-dark&background=0D1117&hide_border=true&ring=FF9900&fire=FF9900&currStreakLabel=FF9900&disable_animations=true
          path: profile/streak-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=vahiwe&theme=default&hide_border=true&ring=FF9900&fire=FF9900&currStreakLabel=C26F00&disable_animations=true
          path: profile/streak-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: vahiwe
          SETTING_JSON: .github/profile-3d.json

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg profile-3d-contrib/*.svg
          git commit -m "Update README cards" || exit 0
          git push
